name: husky-linux
description: Husky Linux - deklarativní atomická distribuce (Fedora Kinoite, KDE Plasma, NVIDIA open drivers, gaming & dev)
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open
image-version: latest

modules:
  - type: files
    files:
      - usr: /usr

  # Jaderné moduly (ublue akmods) pro hardware a udev pravidla
  - type: akmods
    install:
      - openrazer
      - openrgb

  # Systémové balíčky vrstvené v obrazu (ověřené z oficiálních Fedora repozitářů)
  - type: rpm-ostree
    install:
      # Corsair ovladač a daemon
      - ckb-next

      # Nástroje pro monitoring a optimalizaci GPU / her
      - nvtop
      - mangohud
      - goverlay

      # Vývoj a kontejnery (pro práci s Antigravity bez zásahu do systému)
      - distrobox

      # Užitečné systémové utility pro daily driver
      - btop
      - fastfetch
      - git
      - zsh

  # Automatická aktivace systémových služeb (daemons)
  - type: systemd
    system:
      enabled:
        - ckb-next-daemon.service

  # Výchozí aplikace přes Flatpak (z Flathubu)
  # Izolované od základního systému, šetří místo a zaručují stabilitu
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          # Herní stack
          - com.valvesoftware.Steam
          - net.davidotek.pupgui2               # ProtonUp-Qt (správa GE-Protonu a Wine-GE)

          # Správa oprávnění Flatpaků (povolení přístupu Steamu na další SSD disky)
          - com.github.tchx84.Flatseal

          # NVIDIA a hardware utility
          - com.leinardi.gwe                     # GreenWithEnvy (monitoring GPU, křivky ventilátorů, takty)
          - com.dec05eba.gpu_screen_recorder     # GPU Screen Recorder (hardwarový ShadowPlay s NVENC)
          - org.polychromatic.controller         # Polychromatic (správa periferií Razer)
          - org.openrgb.OpenRGB                  # OpenRGB (univerzální RGB)

          # Zrcadlení a multimédia
          - dev.lizardbyte.sunshine              # Sunshine server pro streamování plochy/her na TV přes NVENC
          - org.gnome.NetworkDisplays            # Miracast / Wi-Fi Display zrcadlení na TV
          - org.videolan.VLC                     # Multimediální přehrávač se všemi kodeky

  # Podepisování obrazu pro bezpečné atomické aktualizace
  - type: signing
