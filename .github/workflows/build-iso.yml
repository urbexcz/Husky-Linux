name: build-husky-iso

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag obrazu pro sestavení ISO (výchozí: latest)"
        default: "latest"
        required: true
        type: string
      fedora_version:
        description: "Verze Fedory (výchozí: 45)"
        default: "45"
        required: true
        type: string

jobs:
  build-iso:
    name: Generate Installer ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Build ISO using container installer
        id: build
        uses: jasonn3/build-container-installer@main
        with:
          arch: x86_64
          image_name: husky-linux
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: ${{ github.event.inputs.image_tag }}
          version: ${{ github.event.inputs.fedora_version }}
          variant: Kinoite
          iso_name: husky-linux-${{ github.event.inputs.image_tag }}.iso

      - name: Publish ISO to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso
          name: "Husky Linux Installer ISO"
          body: "Instalační ISO obraz pro Husky Linux (Fedora 45 Kinoite, Nvidia Open)."
          files: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: husky-linux-iso
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
