name: build-husky-linux

on:
  schedule:
    - cron: "00 17 * * *" # Automatické denní sestavení v 17:00 UTC po aktualizacích upstreamu
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches:
      - main
  workflow_dispatch: # Možnost spustit ručně tlačítkem v GitHub Actions

jobs:
  bluebuild:
    name: Build Husky Linux Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build and Push Custom Image
        uses: blue-build/github-action@v1.8.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          maximize_build_space: true
