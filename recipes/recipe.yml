# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
name: husky-linux
description: Husky Linux - cisty herni a pracovni system (Fedora 45 Kinoite, KDE Plasma, NVIDIA Open)
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open
image-version: 45

modules:
  - type: dnf
    install:
      packages:
        - git
        - ckb-next
        - openrgb
        - steam-devices
        - gamemode
        - mangohud
        - gamescope
        - fastfetch

  - type: systemd
    system:
      enabled:
        - ckb-next-daemon.service

  - type: signing
